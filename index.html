<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Психологический Рок-Тест</title>
  <style>
    :root {
      --bg-color: #0a0a0a;
      --card-bg: #121212;
      --accent-color: #ff0000;
      --accent-glow: rgba(255, 0, 0, 0.5);
      --text-main: #f0f0f0;
      --text-muted: #999999;
      --border-color: #222222;
      --font-header: 'Impact', 'Arial Black', sans-serif;
      --font-body: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    /* Зернистый фон (Noise Overlay) */
    .grain-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
      opacity: 0.07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Виниловая пластинка (Pure CSS) */
    .vinyl-container {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 580px;
      height: 580px;
      margin-top: -290px;
      margin-left: -290px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.12;
      animation: vinylRotate 25s linear infinite;
      background: radial-gradient(circle, 
        #050505 0%, #151515 10%, 
        var(--accent-color) 11%, #000 12%, 
        #1e1e1e 20%, #0a0a0a 30%, 
        #222222 40%, #0d0d0d 50%, 
        #1c1c1c 65%, #050505 100%
      );
      box-shadow: 0 0 50px rgba(0,0,0,0.9), inset 0 0 25px rgba(0,0,0,0.9);
      transition: background 0.5s ease;
    }

    @keyframes vinylRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Силуэты гитар по бокам */
    .guitar-side {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 180px;
      height: 450px;
      opacity: 0.15;
      pointer-events: none;
      z-index: 2;
      color: var(--accent-color);
      transition: color 0.5s ease;
    }

    .guitar-left { left: -30px; }
    .guitar-right { right: -30px; transform: translateY(-50%) scaleX(-1); }

    /* Главный контейнер */
    .quiz-container {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 2px solid var(--accent-color);
      box-shadow: 0 0 25px var(--accent-glow), inset 0 0 15px rgba(0,0,0,0.8);
      padding: 35px 30px;
      border-radius: 4px;
      transition: border-color 0.5s ease, box-shadow 0.5s ease;
    }

    /* Шкала прогресса */
    .progress-section {
      margin-bottom: 25px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-header);
      font-size: 1.1rem;
      letter-spacing: 1px;
      color: var(--accent-color);
      margin-bottom: 8px;
      text-transform: uppercase;
      transition: color 0.5s ease;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: #1a1a1a;
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 20%;
      background: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-color);
      transition: width 0.4s ease, background-color 0.5s ease;
    }

    /* Заголовок вопроса */
    .question-title {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 30px;
      min-height: 60px;
    }

    /* Варианты ответов */
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .option-btn {
      background: #181818;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 16px 20px;
      font-size: 0.95rem;
      line-height: 1.4;
      text-align: left;
      cursor: pointer;
      border-left: 4px solid var(--border-color);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .option-btn:hover {
      background: #222222;
      border-color: var(--accent-color);
      border-left-color: var(--accent-color);
      box-shadow: 0 0 12px var(--accent-glow);
      transform: translateX(4px);
    }

    .option-btn strong {
      color: var(--accent-color);
      margin-right: 8px;
      font-family: var(--font-header);
      font-size: 1.1rem;
      transition: color 0.5s ease;
    }

    /* Глитч-анимация при смене вопросов */
    .glitch-effect {
      animation: glitchAnim 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }

    @keyframes glitchAnim {
      0% { transform: translate(0); opacity: 1; }
      20% { transform: translate(-6px, 3px); filter: hue-rotate(90deg) contrast(150%); opacity: 0.8; }
      40% { transform: translate(6px, -3px); filter: invert(30%); }
      60% { transform: translate(-4px, 2px); opacity: 0.9; }
      80% { transform: translate(3px, -1px); filter: hue-rotate(-90deg); }
      100% { transform: translate(0); opacity: 1; filter: none; }
    }

    /* Итоговый экран */
    .result-screen {
      display: none;
      text-align: center;
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-title {
      font-family: var(--font-header);
      font-size: 2.2rem;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-shadow: 0 0 10px var(--accent-glow);
      transition: color 0.5s ease;
    }

    .result-img {
      max-width: 100%;
      height: auto;
      max-height: 280px;
      border: 2px solid var(--accent-color);
      box-shadow: 0 0 15px var(--accent-glow);
      margin-bottom: 20px;
      object-fit: cover;
      transition: border-color 0.5s ease;
    }

    .result-desc {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #dddddd;
      margin-bottom: 30px;
    }

    /* Блок с Жориком */
    .zhorik-block {
      background: #0d0d0d;
      border: 1px dashed var(--accent-color);
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 30px;
      text-align: left;
      transition: border-color 0.5s ease;
    }

    .zhorik-img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 0 5px var(--accent-glow));
    }

    .zhorik-text {
      font-style: italic;
      font-size: 0.95rem;
      line-height: 1.4;
      color: #ffffff;
    }

    .zhorik-name {
      display: block;
      font-family: var(--font-header);
      color: var(--accent-color);
      font-style: normal;
      font-size: 1.1rem;
      margin-bottom: 4px;
      transition: color 0.5s ease;
    }

    /* Кнопка рестарта */
    .restart-btn {
      background: var(--accent-color);
      color: #000;
      font-family: var(--font-header);
      font-size: 1.2rem;
      text-transform: uppercase;
      padding: 14px 35px;
      border: none;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .restart-btn:hover {
      transform: scale(1.05);
      background: #ffffff;
      box-shadow: 0 0 25px #ffffff;
    }

    @media (max-width: 600px) {
      .quiz-container { padding: 20px 15px; }
      .guitar-side { display: none; }
      .zhorik-block { flex-direction: column; text-align: center; }
      .zhorik-img { width: 80px; height: 80px; }
      .result-title { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

  <!-- Графические спецэффекты на фоне -->
  <div class="grain-overlay"></div>
  <div class="vinyl-container"></div>

  <!-- Левая гитара -->
  <svg class="guitar-side guitar-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
    <path d="M19.5 4.5L16.5 7.5M16.5 7.5L14 5M16.5 7.5L19 10M14.5 9.5L7 17C6 18 4.5 18 3.5 17C2.5 16 2.5 14.5 3.5 13.5L11 6M10.5 13.5L6.5 9.5M14.5 17.5L10.5 13.5" />
  </svg>

  <!-- Правая гитара -->
  <svg class="guitar-side guitar-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
    <path d="M19.5 4.5L16.5 7.5M16.5 7.5L14 5M16.5 7.5L19 10M14.5 9.5L7 17C6 18 4.5 18 3.5 17C2.5 16 2.5 14.5 3.5 13.5L11 6M10.5 13.5L6.5 9.5M14.5 17.5L10.5 13.5" />
  </svg>

  <!-- Главная карточка -->
  <div class="quiz-container" id="quiz-box">
    
    <!-- Интерактивная зона вопросов -->
    <div id="question-screen">
      <div class="progress-section">
        <div class="progress-header">
          <span>Рок-Тест</span>
          <span id="progress-text">Вопрос 1 из 5</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="question-title" id="question-text">
        Loading...
      </div>

      <div class="options-container" id="options-box">
        <!-- Кнопки создаются динамически через JS -->
      </div>
    </div>

    <!-- Финальный экран -->
    <div class="result-screen" id="result-screen">
      <h2 class="result-title" id="result-title">Результат</h2>
      <img src="" alt="Результат" class="result-img" id="result-img">
      <p class="result-desc" id="result-desc"></p>

      <!-- Обязательный блок с Жориком -->
      <div class="zhorik-block">
        <img src="zhorik.png" alt="Жорик" class="zhorik-img">
        <div class="zhorik-text">
          <span class="zhorik-name">Жорик вещает:</span>
          <span id="zhorik-quote">...</span>
        </div>
      </div>

      <button class="restart-btn" onclick="restartQuiz()">Пройти заново</button>
    </div>

  </div>

  <script>
    // Массив вопросов строго по ТЗ
    const questions = [
      {
        question: "Вам нужно принять решение в ситуации, где правила игры постоянно меняются сверху:",
        options: [
          { text: "A: Перестану суетиться и адаптируюсь под текущий момент. Пусть система сама определится, а я сохраню автономность и нервы.", type: "himera" },
          { text: "B: Буду гнуть свою линию и задавать структуру сам, даже если придется идти напролом и тратить кучу сил.", type: "tomorrow" }
        ]
      },
      {
        question: "Проект, в который вы вложили много сил, явно зашел в тупик из-за системных ошибок:",
        options: [
          { text: "A: Фиксирую убытки и фиксирую опыт. Нет смысла вливать ресурсы в то, что отжило свое — лучше переключиться на новое.", type: "himera" },
          { text: "B: Упрусь до последнего и пересоберу конструкцию. Любой тупик — это просто проверка на прочность и повод перестроить подход.", type: "tomorrow" }
        ]
      },
      {
        question: "Вы видите, как в коллективе или системе разгорается затяжной конфликт интересов:",
        options: [
          { text: "A: Отойду на безопасное расстояние и буду наблюдать. В чужой рубке легко сгореть ни за что, а со стороны видно лучше.", type: "himera" },
          { text: "B: Вмешаюсь и попытаюсь вытащить проблему на свет, чтобы разрубить этот узел, даже если рискую стать виноватым для всех.", type: "tomorrow" }
        ]
      },
      {
        question: "Перед вами встает выбор: синица в руках или журавль в небе в условиях полной неопределенности:",
        options: [
          { text: "A: Выберу то, что дает устойчивость прямо сейчас. Иллюзии о великом будущем не стоят реальных потерь в настоящем.", type: "himera" },
          { text: "B: Рискну ради масштаба и цели. Без высокого замысла и движения вперед любое \"сейчас\" быстро превращается в болото.", type: "tomorrow" }
        ]
      },
      {
        question: "Как вы относитесь к ситуациям, когда приходится отвечать за чужие промахи?",
        options: [
          { text: "A: Четко обозначаю границы. Ответственность должна быть персональной, иначе система плодит паразитов.", type: "himera" },
          { text: "B: Просто беру и делаю за двоих. Главное — общий результат и движение вперед, а разбираться, кто виноват, будем потом.", type: "tomorrow" }
        ]
      }
    ];

    let currentQuestion = 0;
    let scores = { himera: 0, tomorrow: 0 };

    const quizBox = document.getElementById('quiz-box');
    const questionText = document.getElementById('question-text');
    const optionsBox = document.getElementById('options-box');
    const progressText = document.getElementById('progress-text');
    const progressFill = document.getElementById('progress-fill');

    const questionScreen = document.getElementById('question-screen');
    const resultScreen = document.getElementById('result-screen');
    const resultTitle = document.getElementById('result-title');
    const resultImg = document.getElementById('result-img');
    const resultDesc = document.getElementById('result-desc');
    const zhorikQuote = document.getElementById('zhorik-quote');

    function loadQuestion() {
      const q = questions[currentQuestion];
      progressText.innerText = `Вопрос ${currentQuestion + 1} из ${questions.length}`;
      progressFill.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
      
      questionText.innerText = q.question;
      optionsBox.innerHTML = '';

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = opt.text.replace(/^(A:|B:)/, '<strong>$1</strong>');
        btn.onclick = () => selectOption(opt.type);
        optionsBox.appendChild(btn);
      });
    }

    function selectOption(type) {
      scores[type]++;
      
      // Агрессивный глитч-эффект при переходе
      quizBox.classList.add('glitch-effect');
      setTimeout(() => {
        quizBox.classList.remove('glitch-effect');
      }, 350);

      currentQuestion++;

      if (currentQuestion < questions.length) {
        setTimeout(loadQuestion, 150);
      } else {
        setTimeout(showResult, 200);
      }
    }

    function showResult() {
      questionScreen.style.display = 'none';
      resultScreen.style.display = 'block';

      if (scores.himera >= scores.tomorrow) {
        // Итог "Химера"
        document.documentElement.style.setProperty('--accent-color', '#00f5d4');
        document.documentElement.style.setProperty('--accent-glow', 'rgba(0, 245, 212, 0.4)');
        
        resultTitle.innerText = 'Химера';
        resultImg.src = 'himera.webp';
        resultDesc.innerText = 'Ты умеешь сохранять автономность и трезвый расчёт в любом хаосе. Зачем ломать лоб о закрытые двери, когда можно адаптироваться, выждать момент и победить без лишних потерь? Твой холодный разум — твой главный щит.';
        zhorikQuote.innerText = '«Ну что, хитрый лис, решил переждать бурю в тени? Умно. Главное — не засни там, а то струны заржавеют!»';
      } else {
        // Итог "Когда настанет завтра"
        document.documentElement.style.setProperty('--accent-color', '#ffd700');
        document.documentElement.style.setProperty('--accent-glow', 'rgba(255, 215, 0, 0.4)');
        
        resultTitle.innerText = 'Когда настанет завтра';
        resultImg.src = 'tomorrow.webp';
        resultDesc.innerText = 'Твой путь — идти напролом, ломать стены и брать ответственность на себя. Ты не ждёшь милости от обстоятельств, а сам выжигаешь дорогу к цели. Горячее сердце и несгибаемая воля — твой главный мотор.';
        zhorikQuote.innerText = '«Опять лезешь на амбразуру с гитарой наперевес? Уважаю огненный напор, но смотри не сгори до зари!»';
      }
    }

    function restartQuiz() {
      scores = { himera: 0, tomorrow: 0 };
      currentQuestion = 0;

      // Сброс цвета темы обратно на Красный
      document.documentElement.style.setProperty('--accent-color', '#ff0000');
      document.documentElement.style.setProperty('--accent-glow', 'rgba(255, 0, 0, 0.5)');

      resultScreen.style.display = 'none';
      questionScreen.style.display = 'block';

      loadQuestion();
    }

    // Запуск первого вопроса
    loadQuestion();
  </script>
</body>
</html>
